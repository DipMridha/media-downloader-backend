<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Media Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 30px auto;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(15px);
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #d1d5db;
      margin-bottom: 25px;
    }

    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin: 15px 0;
      color: #fbbf24;
      min-height: 20px;
    }

    .result {
      display: none;
      margin-top: 20px;
      background: rgba(0,0,0,0.25);
      border-radius: 16px;
      padding: 18px;
    }

    .thumbnail {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .duration {
      color: #d1d5db;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0 10px;
    }

    .format-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .format-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 13px;
    }

    .format-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .format-name {
      font-size: 15px;
      font-weight: bold;
    }

    .format-details {
      color: #cbd5e1;
      font-size: 13px;
      margin-top: 5px;
    }

    .format-download {
      background: #16a34a;
      padding: 9px 13px;
      font-size: 13px;
      white-space: nowrap;
    }

    .format-download:hover {
      background: #15803d;
    }

    .no-format {
      color: #9ca3af;
      font-size: 14px;
      padding: 10px 0;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #9ca3af;
      font-size: 13px;
    }

    @media (max-width: 600px) {

      .container {
        margin: 10px auto;
        padding: 18px;
      }

      .input-box {
        flex-direction: column;
      }

      .input-box button {
        width: 100%;
      }

      .format-info {
        align-items: flex-start;
      }

      .format-download {
        padding: 8px 10px;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <h1>⚡ Media Downloader</h1>

    <p class="subtitle">
      Download your media easily
    </p>

    <div class="input-box">

      <input
        type="text"
        id="url"
        placeholder="Paste media URL here..."
      >

      <button
        id="analyzeBtn"
        onclick="analyzeMedia()"
      >
        Analyze
      </button>

    </div>

    <div
      class="message"
      id="message"
    ></div>

    <div
      class="result"
      id="result"
    >

      <img
        id="thumbnail"
        class="thumbnail"
        src=""
        alt="Thumbnail"
      >

      <div
        class="title"
        id="title"
      ></div>

      <div
        class="duration"
        id="duration"
      ></div>


      <!-- VIDEO -->

      <div class="section-title">
        🎥 Video Quality
      </div>

      <div
        class="format-list"
        id="videoList"
      ></div>


      <!-- AUDIO -->

      <div class="section-title">
        🎵 Audio Quality
      </div>

      <div
        class="format-list"
        id="audioList"
      ></div>

    </div>

    <div class="footer">
      Media Downloader
    </div>

  </div>


  <script>

    const API_URL =
      "https://media-downloader-backend-dkqe.onrender.com";


    // Store analyzed formats
    let currentFormats = [];


    // Format duration
    function formatDuration(seconds) {

      if (!seconds || isNaN(seconds)) {
        return "Duration unavailable";
      }

      seconds = Math.floor(Number(seconds));

      const hours =
        Math.floor(seconds / 3600);

      const minutes =
        Math.floor((seconds % 3600) / 60);

      const secs =
        seconds % 60;


      if (hours > 0) {

        return (
          hours +
          ":" +
          String(minutes).padStart(2, "0") +
          ":" +
          String(secs).padStart(2, "0")
        );

      }


      return (
        minutes +
        ":" +
        String(secs).padStart(2, "0")
      );

    }


    // Format file size
    function formatSize(bytes) {

      if (!bytes || isNaN(bytes)) {
        return "Size unavailable";
      }

      bytes = Number(bytes);

      const mb =
        bytes / (1024 * 1024);

      if (mb < 1) {

        return (
          (bytes / 1024).toFixed(1) +
          " KB"
        );

      }

      return mb.toFixed(2) + " MB";

    }


    // Create format card
    function createFormatCard(format, index) {

      const card =
        document.createElement("div");

      card.className =
        "format-card";


      const info =
        document.createElement("div");

      info.className =
        "format-info";


      const left =
        document.createElement("div");


      const name =
        document.createElement("div");

      name.className =
        "format-name";


      let quality =
        format.quality ||
        "Unknown quality";


      if (
        format.type === "video" &&
        format.height
      ) {

        quality =
          format.height + "p";

      }


      name.textContent =
        quality;


      const details =
        document.createElement("div");

      details.className =
        "format-details";


      let detailText =
        format.mimeType ||
        "";


      if (
        format.width &&
        format.height
      ) {

        detailText +=
          " • " +
          format.width +
          "x" +
          format.height;

      }


      if (
        format.type === "video"
      ) {

        if (
          format.hasAudio === true
        ) {

          detailText +=
            " • 🔊 Audio included";

        } else if (
          format.hasAudio === false
        ) {

          detailText +=
            " • 🔇 Video only";

        }

      }


      if (
        format.bitrate
      ) {

        detailText +=
          " • " +
          format.bitrate +
          " kbps";

      }


      if (
        format.size
      ) {

        detailText +=
          " • " +
          formatSize(format.size);

      } else if (
        format.filesize
      ) {

        detailText +=
          " • " +
          formatSize(format.filesize);

      }


      details.textContent =
        detailText;


      left.appendChild(name);

      left.appendChild(details);


      const downloadButton =
        document.createElement("button");

      downloadButton.className =
        "format-download";

      downloadButton.textContent =
        "⬇ Download";


      downloadButton.onclick =
        function() {

          downloadFormat(format);

        };


      info.appendChild(left);

      info.appendChild(downloadButton);

      card.appendChild(info);


      return card;

    }


    // Analyze media
    async function analyzeMedia() {

      const url =
        document.getElementById("url")
          .value
          .trim();


      const analyzeBtn =
        document.getElementById("analyzeBtn");


      const message =
        document.getElementById("message");


      const result =
        document.getElementById("result");


      const videoList =
        document.getElementById("videoList");


      const audioList =
        document.getElementById("audioList");


      if (!url) {

        message.textContent =
          "Please paste a media URL first.";

        return;

      }


      analyzeBtn.disabled =
        true;

      analyzeBtn.textContent =
        "Analyzing...";


      message.textContent =
        "Analyzing media...";


      result.style.display =
        "none";


      videoList.innerHTML = "";

      audioList.innerHTML = "";


      try {

        const response =
          await fetch(
            API_URL + "/analyze",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                url: url
              })
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Unable to analyze this URL."
          );

        }


        // Save formats
        currentFormats =
          Array.isArray(data.formats)
            ? data.formats
            : [];


        // Title

        document.getElementById(
          "title"
        ).textContent =
          data.title ||
          "Media";


        // Duration

        document.getElementById(
          "duration"
        ).textContent =
          "⏱ Duration: " +
          formatDuration(data.duration);


        // Thumbnail

        const thumbnail =
          document.getElementById(
            "thumbnail"
          );


        if (data.thumbnail) {

          thumbnail.src =
            data.thumbnail;

          thumbnail.style.display =
            "block";

        } else {

          thumbnail.style.display =
            "none";

        }


        // Separate video/audio

        const videos =
          currentFormats.filter(
            format =>
              format.type === "video"
          );


        const audios =
          currentFormats.filter(
            format =>
              format.type === "audio"
          );


        // Video list

        if (videos.length > 0) {

          videos.forEach(
            (format, index) => {

              videoList.appendChild(
                createFormatCard(
                  format,
                  index
                )
              );

            }
          );

        } else {

          videoList.innerHTML =
            '<div class="no-format">' +
            'No video quality available.' +
            '</div>';

        }


        // Audio list

        if (audios.length > 0) {

          audios.forEach(
            (format, index) => {

              audioList.appendChild(
                createFormatCard(
                  format,
                  index
                )
              );

            }
          );

        } else {

          audioList.innerHTML =
            '<div class="no-format">' +
            'No separate audio quality available.' +
            '</div>';

        }


        result.style.display =
          "block";


        if (
          currentFormats.length > 0
        ) {

          message.textContent =
            "Media analyzed successfully!";

        } else {

          message.textContent =
            "No downloadable formats found.";

        }


      } catch (error) {

        console.error(error);

        message.textContent =
          error.message ||
          "Something went wrong.";

      }


      analyzeBtn.disabled =
        false;

      analyzeBtn.textContent =
        "Analyze";

    }


    // Download selected format
    function downloadFormat(format) {

      const message =
        document.getElementById(
          "message"
        );


      if (
        !format ||
        !format.url
      ) {

        message.textContent =
          "Download URL is unavailable.";

        return;

      }


      message.textContent =
        "Starting download...";


      let downloadUrl =
        API_URL +
        "/download?url=" +
        encodeURIComponent(
          format.url
        );


      // Send EasyDown headers
      if (
        format.headers &&
        Object.keys(format.headers).length > 0
      ) {

        downloadUrl +=
          "&headers=" +
          encodeURIComponent(
            JSON.stringify(
              format.headers
            )
          );

      }


      window.open(
        downloadUrl,
        "_blank"
      );

    }

  </script>

</body>
</html>
